name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Set up Python for inference service syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check TimesFM service Python syntax
        run: python -m py_compile services/timesfm/app.py services/timesfm/batch_forecast.py
      - name: Type-check and run automated tests
        run: npm run test:ci
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependency advisories
        run: bun audit --prod --audit-level=high
      - name: Report full dependency audit
        if: always()
        run: bun audit || true
