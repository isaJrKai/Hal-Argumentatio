name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply compatible security updates for this repair PR
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/google-auth-identity-verification' }}
        run: bun audit fix || true
      - name: Verify refreshed dependency lockfile
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/google-auth-identity-verification' }}
        run: bun install --frozen-lockfile
      - name: Set up Python for inference service syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check TimesFM service Python syntax
        run: python -m py_compile services/timesfm/app.py services/timesfm/batch_forecast.py
      - name: Type-check and run automated tests
        run: npm run test:ci
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependency advisories
        run: bun audit --prod --audit-level=high
      - name: Report full dependency audit
        if: always()
        run: bun audit || true
      - name: Commit compatible security updates to this repair branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/google-auth-identity-verification' && success() }}
        run: |
          if git diff --quiet -- bun.lock package.json; then
            echo "No dependency lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          git commit -m "chore: patch vulnerable dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
