name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set up Python for inference service syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check TimesFM service Python syntax
        run: python -m py_compile services/timesfm/app.py
      - name: Type-check and run automated tests
        run: npm run test:ci
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependency advisories
        run: |
          npm audit --omit=dev --json > /tmp/hal-production-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/hal-production-audit.json');
          const issues = Object.values(report.vulnerabilities || {});
          for (const issue of issues) {
            console.log(`${String(issue.severity).toUpperCase()} ${issue.name} | direct=${issue.isDirect} | range=${issue.range} | fix=${JSON.stringify(issue.fixAvailable)}`);
          }
          const high = issues.filter(issue => issue.severity === 'high' || issue.severity === 'critical');
          console.log(`Production dependency audit: ${issues.length} vulnerable packages; ${high.length} high/critical.`);
          if (high.length) process.exit(1);
          NODE
      - name: Report full development dependency audit
        if: always()
        run: |
          npm audit --json > /tmp/hal-full-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/hal-full-audit.json');
          const issues = Object.values(report.vulnerabilities || {});
          const counts = issues.reduce((out, issue) => {
            out[issue.severity] = (out[issue.severity] || 0) + 1;
            return out;
          }, {});
          console.log(`Full dependency audit (including development tools): ${issues.length} vulnerable packages.`);
          console.log(JSON.stringify(counts));
          for (const issue of issues) {
            console.log(`${String(issue.severity).toUpperCase()} ${issue.name} | direct=${issue.isDirect} | range=${issue.range} | fix=${JSON.stringify(issue.fixAvailable)}`);
          }
          NODE
