name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hal_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Set up Python for inference service syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check TimesFM service Python syntax
        run: |
          python -m py_compile services/timesfm/app.py services/timesfm/batch_forecast.py services/timesfm/forecast_contract.py
          python -m unittest discover -s services/timesfm -p 'test_*.py'
      - name: Type-check and run automated tests
        run: npm run test:ci
      - name: Build production artifacts
        run: npm run build
      - name: Install Playwright for browser workflow verification
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium for browser workflow verification
        shell: bash
        run: |
          # GitHub-hosted runners occasionally lose DNS while apt installs
          # Playwright's OS dependencies. Retry the complete install rather
          # than treating a transient package-mirror outage as a code failure.
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Chromium/system dependency installation failed (attempt $attempt/3); retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "Chromium/system dependency installation failed after 3 attempts."
          exit 1
      - name: Run browser-level proposal acceptance workflow
        run: npx playwright test
      - name: Audit production dependency advisories
        run: bun audit --prod --audit-level=high
      - name: Report full dependency audit
        if: always()
        run: bun audit || true
