name: CI

on:
  pull_request:
  push:
    branches: [main, sale-readiness/documentation-and-safety]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair and commit stale lockfile on the sale-readiness branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/sale-readiness/documentation-and-safety'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and run automated tests
        run: npm run test:ci
