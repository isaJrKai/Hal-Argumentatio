name: Regenerate and verify dependency lockfile

on:
  push:
    branches: [sale-readiness/lockfile-cleanup]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sale-readiness/lockfile-cleanup
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Install regenerated lockfile cleanly
        run: npm ci
      - name: Type-check and run tests
        run: npm run test:ci
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report full dependency audit
        if: always()
        run: npm audit --audit-level=critical
      - name: Commit verified lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate dependency lockfile"
          git push origin HEAD:sale-readiness/lockfile-cleanup
