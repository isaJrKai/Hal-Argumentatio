name: Regenerate dependency lockfile

on:
  push:
    branches: [maintenance/regenerate-lockfile]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/regenerate-lockfile
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile and apply compatible security updates
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix
      - name: Verify clean locked install
        run: npm ci
      - name: Type-check and run automated tests
        run: npm run test:ci
      - name: Build production artifacts
        run: npm run build
      - name: Require no high or critical dependency advisories
        run: |
          npm audit --json > /tmp/hal-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/hal-audit.json');
          const issues = Object.values(report.vulnerabilities || {});
          const blocking = issues.filter(issue => issue.severity === 'high' || issue.severity === 'critical');
          console.log(`Dependency audit: ${issues.length} vulnerable packages; ${blocking.length} high/critical.`);
          for (const issue of issues) {
            console.log(`${String(issue.severity).toUpperCase()} ${issue.name} | fix=${JSON.stringify(issue.fixAvailable)}`);
          }
          if (blocking.length) process.exit(1);
          NODE
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate npm lockfile and apply compatible updates"
          git push origin HEAD:maintenance/regenerate-lockfile
