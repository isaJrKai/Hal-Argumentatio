name: One-time dependency remediation

on:
  push:
    branches:
      - sale-readiness/documentation-and-safety
    paths:
      - .github/workflows/dependency-remediation.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sale-readiness branch
        uses: actions/checkout@v4
        with:
          ref: sale-readiness/documentation-and-safety
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix
      - name: Type-check and run tests before committing
        run: npm run test:ci
      - name: Commit updated dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible dependency advisory fixes"
          git push origin HEAD:sale-readiness/documentation-and-safety
