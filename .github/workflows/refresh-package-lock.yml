name: Refresh npm lockfile and verify HAL branch

on:
  push:
    branches:
      - fix/hal-sale-readiness
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: fix/hal-sale-readiness
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exactly from regenerated lockfile
        run: npm ci

      - name: Type-check and run automated tests
        run: npm run test:ci

      - name: Build production artifacts
        run: npm run build

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile"
          git push origin HEAD:fix/hal-sale-readiness
