name: Refresh dependency lockfiles

on:
  push:
    branches:
      - security/dependency-audit-remediation

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Refresh Bun dependency resolutions
        run: bun update
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Bun lockfile is reproducible
        run: bun install --frozen-lockfile
      - name: Commit refreshed lockfiles
        run: |
          if git diff --quiet -- bun.lock package-lock.json; then
            echo "No lockfile changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package-lock.json
          git commit -m "security: refresh dependency lockfiles"
          git push
      - name: Report production dependency audit
        continue-on-error: true
        run: bun audit --prod --audit-level=high
